name=Classic Aim Controls - Aim with LT, Shoot with RT
version=v4.13.1
description=Archer, Magick Archer and Warfarer (only with a bow equipped): hold LT to aim, press RT to shoot (you keep aiming), release LT to cancel the aim without firing.\n\nWorks on the game's input layer, follows your control bindings, and also handles Piercing Dart, skill arrows, Cloudburst Shot and Cataract Shot. Carried objects and creatures are aimed with LT and thrown with RT, like the bow. Includes a button that sets the game controls to Vocation Action = LT, Cancel = RB, Light Attack = RT, Grab = X.\n\nRequires REFramework (Dragon's Dogma 2). Settings: REFramework menu > Script Generated UI > ClassicAimControls > Settings.
