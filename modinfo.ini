name=Classic Aim Controls - Aim with LT, Shoot with RT
version=v4.5.0
description=Archer and Magick Archer: hold LT to aim, press RT to shoot (you keep aiming), release LT to cancel the aim without firing.\n\nWorks on the game's input layer, follows your control bindings, and also handles Piercing Dart and skill arrows.\n\nRequires REFramework (Dragon's Dogma 2). Settings: REFramework menu > Script Generated UI > ClassicAimControls.
